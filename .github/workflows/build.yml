name: Build AlanyGram IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      telegram_ipa_url:
        description: 'Прямая ссылка на расшифрованный Telegram.ipa (оставьте пустым для авто-загрузки)'
        required: false
        default: ''

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=~/theos" >> $GITHUB_ENV
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip master.zip -d ~/theos/sdks
          mv ~/theos/sdks/sdks-master/* ~/theos/sdks/
          rm -rf master.zip ~/theos/sdks/sdks-master

      - name: Install Build Tools (ldid & insert_dylib)
        run: |
          brew install ldid
          git clone --depth 1 https://github.com/tyilo/insert_dylib.git
          cd insert_dylib
          xcodebuild -project insert_dylib.xcodeproj -configuration Release
          sudo cp build/Release/insert_dylib /usr/local/bin/
          cd ..
          rm -rf insert_dylib

      - name: Compile AlanyGram Tweak
        run: |
          make clean
          make package FINALPACKAGE=1
          ls -la .theos/obj/ || ls -la packages/

      - name: Download Telegram IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.telegram_ipa_url }}" ]; then
            echo "Скачивание IPA по указанной ссылке..."
            curl -fLo Telegram.ipa "${{ github.event.inputs.telegram_ipa_url }}"
          else
            echo "Скачивание новейшего Telegram 12.9.2..."
            gh release download v12.9.2-3743 -R sorried/ayu-ios -p "Telegram-12.9.2-3743-sideload.ipa" -O Telegram.ipa
          fi

      - name: Inject Tweak and Brand AlanyGram
        run: |
          mkdir -p work
          unzip -q Telegram.ipa -d work/
          
          # Находим .app
          APP_PATH=$(find work/Payload -maxdepth 1 -name "*.app")
          echo "Found app at $APP_PATH"
          
          # Находим скомпилированный AlanyGram.dylib
          DYLIB_PATH=$(find .theos packages -name "AlanyGram.dylib" 2>/dev/null | head -n 1)
          if [ -z "$DYLIB_PATH" ]; then
            echo "Извлечение dylib из .deb..."
            mkdir -p extracted
            dpkg-deb -x packages/*.deb extracted/
            DYLIB_PATH=$(find extracted -name "AlanyGram.dylib" | head -n 1)
          fi
          
          echo "Found dylib at: $DYLIB_PATH"
          cp "$DYLIB_PATH" ./AlanyGram.dylib
          cp "$DYLIB_PATH" "$APP_PATH/AlanyGram.dylib"
          
          # Подписываем dylib (ad-hoc ldid)
          ldid -S "$APP_PATH/AlanyGram.dylib"
          
          # Удаляем ограничение UISupportedDevices для совместимости со всеми iPhone
          /usr/libexec/PlistBuddy -c "Delete :UISupportedDevices" "$APP_PATH/Info.plist" || true

          # Удаляем PlugIns и Watch, если остались
          rm -rf "$APP_PATH/PlugIns" "$APP_PATH/Watch"

          # Устанавливаем независимый Bundle ID и имя AlanyGram
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier ru.aslan.alanygram" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName AlanyGram" "$APP_PATH/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName AlanyGram" "$APP_PATH/Info.plist" || true

          # Патчим встроенный раздел настроек Telegram: "Дополнительно" -> "Настройки AlanyGram", "Extras" -> "AlanyGram"
          python3 -c '
          import os
          fw_file = "'"$APP_PATH"'/Frameworks/TelegramUIFramework.framework/TelegramUIFramework"
          if os.path.exists(fw_file):
              with open(fw_file, "rb") as f:
                  data = f.read()
              
              old_ru = "Дополнительно".encode("utf-8") + b"\x00\x00\x00\x00\x00\x00"
              new_ru = "Настройки AlanyGram".encode("utf-8") + b"\x00\x00\x00\x00"
              if old_ru in data:
                  data = data.replace(old_ru, new_ru)
                  print("Patched RU settings tab to: Настройки AlanyGram")
              
              old_en = b"Extras\x00\x00\x00\x00\x00\x00\x00\x00\x00"
              new_en = b"AlanyGram\x00\x00\x00\x00\x00\x00"
              if old_en in data:
                  data = data.replace(old_en, new_en)
                  print("Patched EN settings tab to: AlanyGram")
              
              with open(fw_file, "wb") as f:
                  f.write(data)
          '
          ldid -S "$APP_PATH/Frameworks/TelegramUIFramework.framework/TelegramUIFramework" || true

          # Внедряем вызов dylib в бинарник Telegram
          BINARY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")
          echo "Executable name: $BINARY_NAME"
          insert_dylib "@executable_path/AlanyGram.dylib" "$APP_PATH/$BINARY_NAME" --all-yes --inplace
          ldid -S "$APP_PATH/$BINARY_NAME" || true
          
          # Переупаковываем IPA
          cd work
          zip -q -r ../AlanyGram.ipa Payload
          cd ..
          echo "Готово! AlanyGram.ipa (Telegram 12.9.2) создан."

      - name: Upload Ready AlanyGram IPA
        uses: actions/upload-artifact@v4
        with:
          name: AlanyGram-IPA
          path: AlanyGram.ipa
          retention-days: 14

      - name: Upload Tweak Dylib & Deb
        uses: actions/upload-artifact@v4
        with:
          name: AlanyGram-Tweak-Files
          path: |
            AlanyGram.dylib
            packages/*.deb
          retention-days: 14
